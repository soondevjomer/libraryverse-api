spring.application.name=${PROJECT_NAME}

#SERVER
server.address=0.0.0.0
server.port=${PORT:8080}

# LOGGING
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO
logging.level.com.soondevjomer.libraryverse=INFO

#DATABASE
spring.datasource.url=${JDBC_URL}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#JPA
spring.jpa.database=mysql
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

#JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS}

#FILE
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE_REQ}

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/prod
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.clean-on-validation-error=false

# FILE STORAGE
storage=cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}